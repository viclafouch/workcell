packages:
  - packages/*

catalogMode: strict
catalogPrune: true
engineStrict: true
verifyDepsBeforeRun: false
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - '@tanstack/*'
  - '@json-render/*'

catalog:
  '@chat-adapter/slack': 4.45.0
  '@chat-adapter/state-memory': 4.45.0
  '@json-render/chat': 0.23.1
  '@opentelemetry/api': ^1.10.0
  '@opentelemetry/core': ^3.1.1
  '@opentelemetry/sdk-node': ^0.301.1
  '@opentelemetry/sdk-trace': ^3.1.1
  '@tanstack/ai': 1.4.0
  '@tanstack/ai-anthropic': 1.1.1
  '@tanstack/ai-compaction': 1.0.1
  '@tanstack/ai-harness': 0.3.0
  '@tanstack/ai-harness-cli': 0.1.2
  '@tanstack/ai-mcp': 1.2.0
  '@tanstack/ai-openai': 1.1.1
  '@tanstack/ai-persistence': 1.0.1
  '@tanstack/ai-sandbox': 1.3.0
  '@tanstack/ai-sandbox-docker': 1.1.0
  '@tanstack/ai-sandbox-local-process': 1.0.0
  '@tanstack/ai-skills': 1.0.2
  '@tanstack/pacer': 0.23.1
  '@testcontainers/postgresql': ^12.2.1
  '@types/dockerode': 4.0.2
  '@types/node': ^26.6.6
  '@types/pg': ^8.23.1
  '@viclafouch/oxc-config': ^3.0.0
  chat: 4.45.0
  dockerode: 4.0.12
  eslint-plugin-turbo: ^2.11.11
  knip: ^6.45.1
  lefthook: 2.2.1
  msw: ^3.0.4
  node-pg-migrate: ^9.0.0
  oxfmt: ~0.78.0
  oxlint: ~1.93.0
  oxlint-tsgolint: 7.0.2006
  pg: ^8.23.1
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  pino-roll: ^4.0.0
  turbo: ^2.11.11
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7

allowBuilds:
  cpu-features: false
  lefthook: true
  protobufjs: false
  ssh2: false
patchedDependencies:
  '@tanstack/ai-harness@0.3.0': patches/@tanstack__ai-harness@0.3.0.patch
  '@tanstack/ai@1.4.0': patches/@tanstack__ai@1.4.0.patch
