name: Setup
description: Install Node, pnpm and the dependencies, then restore the Turborepo cache of the job.

inputs:
  turbo-cache:
    description: The name of the Turborepo cache of the job. Empty restores none.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3.2.0
      with:
        cache: true
        save-cache: ${{ github.ref == 'refs/heads/main' }}

    - if: inputs.turbo-cache != ''
      uses: actions/cache@v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: turbo-${{ inputs.turbo-cache }}-${{ runner.os }}-${{ runner.arch }}-
